services:

  web:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile

    command:
      [
        "gunicorn",
        "config.wsgi:application",
        "-c",
        "deployment/docker/gunicorn.conf.py"
      ]

    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    expose:
      - "8000"

    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'X-Forwarded-Proto': 'https'}))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USER}",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  celery:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile

    command:
      [
        "celery",
        "-A",
        "config",
        "worker",
        "--loglevel=INFO"
      ]

    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile

    command:
      [
        "celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO"
      ]

    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine

    ports:
      - "80:80"

    volumes:
      - ./deployment/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro

    depends_on:
      web:
        condition: service_healthy

    restart: unless-stopped


volumes:
  mysql_data:
  redis_data:
  static_volume:
