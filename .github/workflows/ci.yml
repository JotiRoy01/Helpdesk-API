name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop


permissions:
  contents: read


concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:

  test:
    name: Test & Validate

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: helpdesk_test
          MYSQL_USER: helpdesk_user
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing

      DJANGO_SECRET_KEY: test-only-secret-key

      JWT_SIGNING_KEY: test-only-jwt-signing-key

      DJANGO_DEBUG: "False"

      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

      DB_NAME: helpdesk_test
      DB_USER: helpdesk_user
      DB_PASSWORD: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

      MYSQL_ROOT_PASSWORD: root_password

      REDIS_URL: redis://127.0.0.1:6379/0

      CORS_ALLOWED_ORIGINS: http://localhost:3000

      CSRF_TRUSTED_ORIGINS: http://localhost:3000


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

          cache: pip

          cache-dependency-path: |
            requirements/development.txt


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt


      - name: Ruff
        run: |
          ruff check .


      - name: Black
        run: |
          black --check .


      - name: Django check
        run: |
          python manage.py check


      - name: Migration check
        run: |
          python manage.py makemigrations --check --dry-run


      - name: Validate OpenAPI
        run: |
          python manage.py spectacular --validate


      - name: Run tests
        run: |
          pytest -v


      - name: Coverage
        run: |
          pytest \
            --cov=apps \
            --cov-report=term-missing \
            --cov-report=xml


      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  docker:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - test

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Build Docker image
        run: |
          docker build \
            -f deployment/docker/Dockerfile \
            -t helpdesk-api:${{ github.sha }} \
            .
